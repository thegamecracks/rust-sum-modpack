[package]
name = "sum_modpack"
version = "0.1.0"
edition = "2024"
description = "Fetch filesize statistics for a set of Steam Workshop IDs."

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
log = { version = "0.4.29", features = ["kv", "std"] }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["blocking", "form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"

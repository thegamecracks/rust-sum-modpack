[package]
name = "sum-modpack"
version = "1.0.0"
edition = "2024"
description = "Fetch filesize statistics for a set of Steam Workshop IDs."
readme = "README.md"
license = "MIT"
repository = "https://github.com/thegamecracks/rust-sum-modpack"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
itertools = "0.14.0"
num-format = "0.4.4"
pretty_env_logger = "0.5.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
tabled = "0.20.0"
thiserror = "2.0.18"
tracing = { version = "0.1.44", features = ["log"] }
ureq = { version = "3.3.0", features = ["json"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

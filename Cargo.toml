[package]
name = "sum_modpack"
version = "0.1.0"
edition = "2024"
description = "Fetch filesize statistics for a set of Steam Workshop IDs."

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
serde = "1.0.228"
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
